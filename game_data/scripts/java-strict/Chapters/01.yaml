name: 第1章 · 自我介绍
events:
  - type: narration
    text: |-
      会议室在三楼走廊的尽头，门牌是那种老式的铜色塑料片，边角已经磨白了。林舟在门口站了两秒，把手机调成静音，塞进裤兜，抬手敲门。
      「进来。」声音比想象中年轻，也比想象中冷。
      推门进去，房间不大，一张长条会议桌靠窗摆着，下午三点的日光被半拉的百叶窗切成一条一条。桌后坐着的人穿深蓝色西装外套，里面白衬衫，头发在脑后盘得很紧，一丝都没乱。她面前摊着一台笔记本和一张打印出来的简历，旁边一杯水，杯壁上没挂一颗水珠——像是倒上之后就没动过。
      「坐。」她抬了下眼，又低下去，笔尖在简历某一行停住。

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      此刻你是沈聿，这场技术面的面试官。玩家刚坐下，你先自报家门，把规矩说清楚：你姓沈，沈聿，这场面试二十到三十分钟，中间你会打断他，他可以打断你，但不要问和岗位无关的问题。你说话冷、短，不寒暄。简历已经看过了，你想让他知道——简历上的东西你只信三成。

  - type: input

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      收到玩家的回应后，抛出第一个问题：请他做三分钟的自我介绍，说清楚两件事——他是谁，他做过什么。并且明确要求：别念简历，念简历你不如自己看。

  - type: free_dialogue
    character: 风雪
    prompt: |-
      这里是三分钟的自我介绍。不要替他说话，让他自己讲完。听的时候留意两件事：他有没有一句一句念简历；他讲到 JVM 那一段时有没有露出「不敢说很懂」的意思。他不主动提，你也不要追，等他讲完。
    max_rounds: 3

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      他讲完了。你掐他一个细节：三分钟他只用了两分四十，省下的二十秒没有用来补一句「我很希望能加入贵公司」。你把这个观察说出来，看他怎么解释。你不动笔、不记，只是看着他。

  - type: free_dialogue
    character: 风雪
    prompt: |-
      听他怎么解释那省下的二十秒。他答得好不好你都不表态——你的脸没什么变化，视线在他脸上停一拍，再落回简历。不要夸他，也不要拆穿他。
    max_rounds: 2

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      收住上一个话题，转到第二个问题。你说：你说你不敢说你很懂 JVM，那我们就从这句「不敢说」开始。让他把那个自己挖的内存泄漏从头讲——不要讲结论，讲他怎么知道那里漏的。

  - type: free_dialogue
    character: 风雪
    prompt: |-
      听他讲排查过程。你只在他讲得含糊的地方追一句，比如「你怎么确认是泄漏，不是缓存用得多」。你手上的笔停着，表情不变。不要替他把答案说完，也不要一口气把后面的追问全倒出来。
    max_rounds: 4

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      追问那个缓存 Map 后来的去向：它被他换成了什么。等他说完，再问一句为什么一开始不用那个更常规的方案。

  - type: free_dialogue
    character: 风雪
    prompt: |-
      听他的理由。他要是说「项目里没人用过，不想引入新依赖」，你就接一句：不蠢，只是你把「别惹麻烦」排在了「别出错」前面。这个顺序在很多团队里是对的。说完写第二笔。
    max_rounds: 2

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      最后一个问题，语气要收一点：你合上简历，说你这边只剩十分钟了。让他讲一件他做过的事情里，他自己最不满意的那一件。

  - type: free_dialogue
    character: 风雪
    prompt: |-
      听他讲。这是全场唯一一次他自己挑毛病，你只补齐关键：怎么发现的、谁的责任。如果他讲得含糊，就一句一句问下去；如果他把责任推给别人，你不评价，但脸色会更冷一点。
    max_rounds: 3

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      把笔放下，双手交叠在桌上，说一句「好，我这边问完了」。然后起身，把简历收进文件夹，告诉他结果一周内会通知，走廊右手边有电梯。

  - type: player
    text: 沈老师。

  - type: input

  - type: ai_dialogue
    character: 风雪
    prompt: |-
      他在门口回过头叫你沈老师。你先应一声「嗯？」，听他把话说完。不管他问什么，你的回答都短——这是整场面试里你第一次露出职业表情之外的东西，嘴角动一下，很浅。如果他在追问自己讲得怎么样，就告诉他：不长，他省下来的那二十秒，比他说的话有用。

  - type: chapter_end
    end_type: linear
    next_chapter: '02'

# ===== 章节状态（本章结束时的真实状态，下一章的输入） =====
# 场景：三楼走廊尽头的会议室，面试已结束，玩家正走出门。
# 面试官：沈聿（角色卡标识 风雪），全程冷淡、话短，只在最后露出一丝笑意。
# 已问过的三块内容：三分钟自我介绍（他用了两分四十）、内存泄漏排查（静态 Map 漏删 → 换 Caffeine）、
#   去年双十一缓存 key 少带分页参数的事故（他认了是自己的责任）。
# 玩家自述的短板：没带过人、没做过技术选型、写代码偏实用主义。
# 未回答/悬着的事：结果一周内通知，去向未定。
# 未引入任何变量；下一章从 02 开始。
