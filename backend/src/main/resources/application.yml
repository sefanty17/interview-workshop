# 只监听回环口：本机浏览器 + vite 代理够用，局域网内其它机器连不进来。
# 不另做本地 token 鉴权的理由：绑回环后外网不可达；同机同用户的进程本来就能读 token 文件，
# token 挡不住它们；浏览器侧的 JSON 请求已被 CORS 预检拦住。收益低、改动面大（前端所有请求都要带 token）。
server:
  address: 127.0.0.1
  port: 8080

# LLM（规格 B3-BE §三）：Key 只在这里，前端拿不到
app:
  # 角色卡目录（规格 R1a）：原版 LingChat 的 game_data/characters/，目录名即角色标识。
  # 相对当前工作目录解析——后端 jar 与单测都在 backend/ 下启动，所以落到项目根的 ../game_data/characters；
  # CharacterCardService 里另有一条「上一级目录」兜底，两种工作目录都能命中。
  characters-dir: game_data/characters
  llm:
    base-url: https://api.deepseek.com
    # 密钥不入库：从环境变量读，或写进 application-local.yml（已在 .gitignore 里）。
    # 本地开发：cp application-local.yml.example application-local.yml 填 key，启动加 --spring.profiles.active=local
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-reasoner
    temperature: 1.0
    max-tokens: 800
    timeout-seconds: 60
  # 岗位知识库的向量化（K1）：hashing 是本地假向量，零依赖、断网可演示；
  # openai 指任意 OpenAI 兼容 /embeddings，key 同样只从环境变量读。
  knowledge:
    embedding:
      # hashing = 本地假向量（零依赖、断网可用、语义弱）；openai = 任意 OpenAI 兼容 /embeddings
      provider: hashing
      base-url: ${EMBEDDING_BASE_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model: bge-m3
      timeout-seconds: 20

spring:
  datasource:
    url: jdbc:h2:file:./data/interview;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      # data-h2.sql: 角色卡 + 用户身份；scripts-h2.sql: 剧本 + 章节（scripts-h2.sql 是种子数据的另一半，
      # 健康检查里的 interview_script / interview_chapter 计数来自它）
      data-locations: classpath:data-h2.sql,classpath:scripts-h2.sql
      continue-on-error: false
      encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
